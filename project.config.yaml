coverage:
  backend:
    threshold: 90
    lines: 90
    branches: 90
    functions: 90
    statements: 90
  frontend:
    threshold: 90
    lines: 90
    branches: 90
    functions: 90
    statements: 90
    exclude:
      - "**/*.d.ts"
      - "**/index.ts"
      - "**/*.config.*"
      - "**/generated/**"

i18n:
  enabled: false
  default_locale: pt-BR
  locales: []

e2e:
  enabled: true
  tool: playwright
  critical_flows:
    - onboarding_to_map
    - map_to_hospital_detail
    - hospital_to_route
    - compare_hospitals

ci:
  platform: github

openapi:
  path: docs/api/openapi.yaml
  contract_first: true

process_metrics:
  enabled: true
  project_started_at: "2026-06-10T00:53:00Z"  # spawn — noite 2026-06-09 BRT
  idle_threshold_hours: 4
  ai_minutes_per_round_default: 3
  active_context:
    card_id: CARD-001
    phase: FASE-1
    activity: implementation

quality_health:
  enabled: true
  last_run_json: docs/meta/quality-runs/latest.json
  last_run_manual: docs/meta/quality-runs/manual.yaml
  test_roots:
    unit_back: apps/api/internal
    unit_front: apps/web/tests/unit
    integration: apps/api/tests/integration
    contract: apps/api/tests/contract
    e2e: tests/e2e
  coverage_artifacts:
    backend: apps/api/coverage.out
    frontend: apps/web/coverage/lcov.info

project_hub:
  enabled: true
  port: 8090
  modules:
    process: true
    quality: true
    security: true
    accessibility: true
    design: true

git:
  commit:
    convention: conventional
    scope_required: false
    card_ref: footer
    committer: human_or_agent
    custom_template: null
  release:
    strategy: semver_mvp
    initial_version: "0.1.0"
    tag_prefix: v
    changelog: CHANGELOG.md
    version_file: null
    ci_automation: manual

agent_automation:
  run_tests_without_approval: false
  test_scope:
    - unit_integration
  environments:
    - local_dev_only

tracking:
  req_prefix: REQ
  card_prefix: CARD
  phase_prefix: FASE
  branch_feature: feature/
  branch_hotfix: hotfix/
  cards:
    required: true
    provider: markdown
    mirror_in_repo: true
    external:
      base_url: https://github.com/SouCanella/fila_saude
      project_key: null
      board_id: null
      repo: SouCanella/fila_saude
    sync:
      req_ids_in_card: true
      card_id_in_spec: true
    states:
      open: open
      in_progress: in_progress
      done: done
      cancelled: cancelled
