# Docker Compose — FilaSaúde Brasil
# Infra: docker compose up -d postgres redis
# + OSRM dev stub: docker compose --profile routing up -d osrm
# Stack completa: docker compose --profile full up -d

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filasaude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filasaude}
      POSTGRES_DB: ${POSTGRES_DB:-filasaude}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filasaude}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dev stub até dados OSM/OSRM reais (CARD-007). Responde HTTP 200 na porta publicada.
  osrm:
    image: hashicorp/http-echo:0.2.3
    profiles:
      - routing
    command: ["-text=ok", "-listen=:5678"]
    ports:
      - "${OSRM_PORT:-5000}:5678"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-filasaude}:${POSTGRES_PASSWORD:-filasaude}@postgres:5432/${POSTGRES_DB:-filasaude}
      REDIS_URL: redis://redis:6379/0
      OSRM_BASE_URL: http://osrm:5678
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOCK_DATA_ENABLED: ${MOCK_DATA_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    profiles:
      - full

volumes:
  postgres_data:
